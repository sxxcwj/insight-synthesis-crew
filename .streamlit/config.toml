[server]
headless = true
address = "localhost"
port = 8501
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 200

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"
font = "sans serif"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
paddingTop = "1.5rem"
paddingBottom = "3rem"

[theme.sidebar]
backgroundColor = "#F1F5F9"
secondaryBackgroundColor = "#E2E8F0"
