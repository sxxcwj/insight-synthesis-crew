<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 长伴战略研究智能体</title>
    <style>
        :root {
            --bg: #070A10;
            --card: rgba(14, 20, 36, 0.92);
            --line: rgba(255, 255, 255, 0.08);
            --text: #F8FAFC;
            --muted: #94A3B8;
            --blue: #2563EB;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--bg);
            color: var(--text);
            font-family: "PingFang SC", "Segoe UI", sans-serif;
        }
        .card {
            width: min(440px, calc(100% - 32px));
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }
        .eyebrow { color: #93C5FD; font-size: 13px; letter-spacing: 0.08em; }
        h1 { margin: 8px 0 8px; font-size: 26px; }
        p { color: var(--muted); line-height: 1.6; margin: 0 0 20px; }
        label { display: block; font-size: 13px; margin-bottom: 8px; }
        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--line);
            color: var(--text);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 15px;
        }
        button {
            margin-top: 16px;
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 12px 16px;
            background: var(--blue);
            color: white;
            font-size: 15px;
            font-weight: 650;
            cursor: pointer;
        }
        .error { color: #FB7185; min-height: 1.4em; margin-top: 12px; font-size: 13px; }
    </style>
</head>
<body>
    <form class="card" id="loginForm">
        <div class="eyebrow">长伴咨询</div>
        <h1>登录战略研究智能体</h1>
        <p>请输入访问口令。它对应环境变量 APP_PASSWORD 或 ACCESS_TOKEN，不会写进页面。</p>
        <label for="password">访问口令</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">进入</button>
        <div class="error" id="error"></div>
    </form>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const error = document.getElementById("error");
            error.textContent = "";
            const password = document.getElementById("password").value;
            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password })
                });
                if (!response.ok) {
                    error.textContent = "口令不正确";
                    return;
                }
                window.location.href = "/";
            } catch (err) {
                error.textContent = "无法连接服务";
            }
        });
    </script>
</body>
</html>
